# CI of the documentation tooling and content: ONE job `ci` on pull requests (JOURNAL 03:10, the organisation's runners
# are scarce), the required check on main. Cheapest first: unit tests at 100 %, lint of the docs, tested code blocks.
name: Docs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# One run per workflow and ref; a new push cancels the previous run, except on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: docs-tools

jobs:
  ci:
    name: ci
    # A draft pull request runs no CI: mark it ready when you want it.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Unit tests of the docs tooling, 100 % lines, branches and functions
        run: npm test
      - name: Frontmatter, code blocks, MDX-safe prose, links, navigation
        run: npm run lint:docs
      - name: Run every tested code block (strict, a missing binary or server fails)
        run: node bin/docs-tools.mjs run ../content/docs --strict
