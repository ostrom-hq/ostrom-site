# CI of the documentation tooling and content: ONE job `ci` on pull requests (JOURNAL 03:10, the organisation's runners
# are scarce), the required check on main. Cheapest first: unit tests at 100 %, lint of the docs, tested code blocks.
name: Docs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags: ["[0-9]*"]
  workflow_dispatch:

# One run per workflow and ref; a new push cancels the previous run, except on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: docs-tools

jobs:
  ci:
    name: ci
    # A draft pull request runs no CI: mark it ready when you want it.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # The ostrom-core commit the docs are checked against: its api/contract/served-routes.txt (what the server serves)
      # and tools/docs-truth. Move it forward by pull request; the run warns when served-routes.txt moved on main.
      CORE_REF: 7f13c5bf82ca0961bab1ebd626e424116ea7434b
      CORE_KEY_SET: ${{ secrets.DEPLOY_KEY_CORE != '' }}
      SERVER_KEY_SET: ${{ secrets.DEPLOY_KEY_SERVER != '' }}
      CLI_KEYS_SET: ${{ secrets.DEPLOY_KEY_E2E != '' && secrets.DEPLOY_KEY_CLI != '' && secrets.DEPLOY_KEY_CORE != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-tools/package-lock.json
      - run: npm ci
      - name: Unit tests of the docs tooling, 100 % lines, branches and functions
        run: npm test
      - name: Frontmatter, code blocks, MDX-safe prose, links, navigation
        run: npm run lint:docs
      # The API reference (/docs/api/) is built from content/api/openapi.yaml: it must be the contract at CORE_REF byte for
      # byte (scripts/sync-openapi.ts --ref CORE_REF). Until ostrom-core is public, reading it needs the org's read-only
      # deploy key, which pull requests from forks do not get.
      - name: Checkout ostrom-core (the API contract)
        if: env.CORE_KEY_SET == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ostrom-hq/ostrom-core
          ref: ${{ env.CORE_REF }}
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY_CORE }}
          path: .ostrom/core
          persist-credentials: false
      - name: The API reference is the contract at CORE_REF
        if: env.CORE_KEY_SET == 'true'
        run: node bin/docs-tools.mjs api-snapshot ../.ostrom/core/api/openapi.yaml ../content/api/openapi.yaml
      # A block marked requires="ostrom" runs against the real binary, built from ostrom-cli main by the bench's
      # action (cached by commit). Built only when a page needs it.
      # The real binary is built for every run: docs-truth checks each `ostrom …` the pages cite against its help.
      - name: The real CLI is needed
        id: needs
        run: |
          if [ "$CLI_KEYS_SET" = "true" ]; then
            echo "cli=true" >> "$GITHUB_OUTPUT"
          else
            # A fork's pull request gets no secrets: the blocks that need the binary are skipped here, and run on main.
            echo "cli=false" >> "$GITHUB_OUTPUT"
            echo "strict=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=docs-test::no deploy keys: blocks that need the real ostrom are skipped"
          fi
      # ostrom-cli main, built with ostrom-core from source at the commit of its gradle/ostrom-core.ref, as its own CI
      # does: this repository's GITHUB_TOKEN cannot read ostrom-core's Maven packages (JOURNAL 05:50).
      - name: Checkout ostrom-cli main (the binary the pages describe)
        if: steps.needs.outputs.cli == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ostrom-hq/ostrom-cli
          ssh-key: ${{ secrets.DEPLOY_KEY_CLI }}
          path: .ostrom/cli
          persist-credentials: false
      - name: The ostrom-core commit ostrom-cli builds with
        if: steps.needs.outputs.cli == 'true'
        id: clicore
        run: echo "ref=$(tr -d '[:space:]' < ../.ostrom/cli/gradle/ostrom-core.ref)" >> "$GITHUB_OUTPUT"
      - name: Checkout that ostrom-core next to ostrom-cli
        if: steps.needs.outputs.cli == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ostrom-hq/ostrom-core
          ref: ${{ steps.clicore.outputs.ref }}
          ssh-key: ${{ secrets.DEPLOY_KEY_CORE }}
          path: .ostrom/ostrom-core
          persist-credentials: false
      - name: Build ostrom-cli against that checkout
        if: steps.needs.outputs.cli == 'true'
        run: mkdir -p ~/.gradle && echo "ostrom.core.local=true" >> ~/.gradle/gradle.properties
      - name: Checkout ostrom-e2e (the bench's CLI action)
        if: steps.needs.outputs.cli == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ostrom-hq/ostrom-e2e
          ssh-key: ${{ secrets.DEPLOY_KEY_E2E }}
          path: .ostrom/e2e
          persist-credentials: false
      - name: Real ostrom CLI
        if: steps.needs.outputs.cli == 'true'
        id: cli
        uses: ./.ostrom/e2e/.github/actions/cli
        with:
          path: .ostrom/cli
      - name: Checkout ostrom-server main (the variables it reads)
        if: env.SERVER_KEY_SET == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ostrom-hq/ostrom-server
          ssh-key: ${{ secrets.DEPLOY_KEY_SERVER }}
          path: .ostrom/server
          persist-credentials: false
      # docs-truth (ostrom-core/tools/docs-truth): every route a page cites is served (the pinned served-routes.txt),
      # every `ostrom …` command and option is in the binary's help, every OSTROM_ variable is read by the server, the
      # CLI or core; anything else only under "Coming soon". The site's own text (blog, legal, strings) too.
      - name: The docs and the site cite only what the product does (docs-truth)
        if: env.CORE_KEY_SET == 'true'
        working-directory: .
        env:
          OSTROM_BIN: ${{ steps.cli.outputs.bin }}
        run: |
          set -- --routes .ostrom/core/api/contract/served-routes.txt --source .ostrom/core/telemetry
          if [ -n "$OSTROM_BIN" ]; then set -- "$@" --ostrom "$OSTROM_BIN" --source .ostrom/cli; fi
          if [ -d .ostrom/server ]; then set -- "$@" --source .ostrom/server; fi
          if ! git -C .ostrom/core diff --quiet "$CORE_REF" origin/main -- api/contract/served-routes.txt; then
            echo "::warning title=docs-truth::served-routes.txt changed on ostrom-core main since CORE_REF: move CORE_REF forward"
          fi
          node .ostrom/core/tools/docs-truth/bin/docs-truth.mjs "$@" content/docs content/blog content/legal src/i18n/en.ts
      - name: Run every tested code block (strict, a missing binary or server fails)
        env:
          OSTROM_BIN: ${{ steps.cli.outputs.bin }}
          STRICT: ${{ steps.needs.outputs.strict != 'false' && 'yes' || '' }}
        run: node bin/docs-tools.mjs run ../content/docs ${STRICT:+--strict}
      - name: The CLI reference matches the binary's help
        if: steps.needs.outputs.cli == 'true'
        env:
          OSTROM_BIN: ${{ steps.cli.outputs.bin }}
        run: |
          page=../content/docs/reference/cli.mdx
          if grep -q '^status: available' "$page"; then
            node bin/docs-tools.mjs cli-reference "$OSTROM_BIN" "$RUNNER_TEMP/cli.mdx"
            diff -u "$page" "$RUNNER_TEMP/cli.mdx"
          fi
