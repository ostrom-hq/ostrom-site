name: Docs

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: docs-tools

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Unit tests of the docs tooling, 100 % lines, branches and functions
        run: npm test

  docs-lint:
    name: docs-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Frontmatter, code blocks, MDX-safe prose, links, navigation
        run: npm run lint:docs

  docs-test:
    name: docs-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run every tested code block (strict, a missing binary or server fails)
        run: node bin/docs-tools.mjs run ../content/docs --strict
