# CI of ostrom-site: ONE job `ci` on pull requests (organisation rule, JOURNAL 30/10 03:10: the runners are scarce),
# the required check on main. Cheapest first: types, lint, unit tests, the docs tooling, the static build, then the
# image under Playwright and Lighthouse. Publishing the image is a separate job, on main only.
name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# One run per workflow and ref; a new push cancels the previous run, except on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  ci:
    name: ci
    # A draft pull request runs no CI: mark it ready when you want it.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # No dependency cache: this workflow publishes the image on main, and a cache written by a pull request could
      # poison it (zizmor, cache-poisoning). The install takes under a minute.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
      - run: .github/scripts/run.sh typecheck pnpm typecheck
      - run: .github/scripts/run.sh lint pnpm lint
      - run: .github/scripts/run.sh format pnpm format:check
      - name: Unit and component tests, 100 % thresholds
        run: .github/scripts/run.sh coverage pnpm test:coverage
      - name: Coverage summary
        if: always()
        run: |
          node -e 'const t=require("./coverage/coverage-summary.json").total;const r=["lines","branches","functions","statements"].map(k=>`| ${k} | ${t[k].pct} % (${t[k].covered}/${t[k].total}) |`).join("\n");require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY,`### Vitest coverage\n\n| Metric | Value |\n|---|---|\n${r}\n`)' || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: coverage, path: coverage/, if-no-files-found: ignore, retention-days: 7 }

      # The docs tooling and content run in their own workflow (docs.yml, owned by DOCS: contract and real CLI).

      # The static export, its links, and the two images: the production one (ostrom.run URLs) and the Lighthouse
      # one (URLs on localhost, launched, so canonical links point at the audited host).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, package-manager-cache: false }
      - run: .github/scripts/run.sh build pnpm build
      - name: Internal links and anchors
        run: .github/scripts/run.sh links pnpm links
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: ostrom-site:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Lighthouse image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: ostrom-site:lighthouse
          load: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=http://localhost:8080
            NEXT_PUBLIC_APP_URL=http://localhost:8080
            NEXT_PUBLIC_API_URL=http://localhost:8080
            NEXT_PUBLIC_LAUNCHED=1
          cache-from: type=gha

      - name: Start the production image
        run: |
          docker run -d --name site -p 8080:8080 ostrom-site:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/healthz
      - run: pnpm exec playwright install --with-deps chromium
      - name: Playwright, desktop and mobile, against the container
        env: { PLAYWRIGHT_BASE_URL: 'http://localhost:8080' }
        run: .github/scripts/run.sh e2e pnpm e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          { name: playwright-report, path: playwright-report/, if-no-files-found: ignore, retention-days: 7 }

      - name: Start the Lighthouse image
        run: |
          docker rm -f site
          docker run -d --name site -p 8080:8080 ostrom-site:lighthouse
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/healthz
      - name: Lighthouse, mobile, every page of the sitemap, 95 minimum in each category
        run: .github/scripts/run.sh lighthouse pnpm exec lhci autorun --config=lighthouserc.cjs
      - name: Lighthouse, desktop
        env: { LIGHTHOUSE_PROFILE: desktop } # not LHCI_*: lhci reads those as its own options
        run: .github/scripts/run.sh lighthouse pnpm exec lhci autorun --config=lighthouserc.cjs
      # Above all when an assertion fails: the reports say why.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: lighthouse, path: lighthouse-reports/, if-no-files-found: ignore, retention-days: 7 }

  publish:
    name: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/ostrom-hq/ostrom-site
    steps:
      # The tested commit, rebuilt for both architectures (the static export does not depend on the architecture:
      # only the nginx layer differs). No cache in this job: it publishes and signs (zizmor cache-poisoning).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with: { cache-image: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with: { cache-binary: false }
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: { cosign-release: v2.6.5 }
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=ostrom-site
            org.opencontainers.image.licenses=Apache-2.0
      # Not launched (NEXT_PUBLIC_LAUNCHED=0): noindex everywhere until Lyes's go.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: NEXT_PUBLIC_LAUNCHED=0
      - name: Smoke test of the pushed index, each architecture (read-only root, no capability, noindex)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for arch in amd64 arm64; do
            # Each architecture by its own manifest digest: the Docker image store cannot hold two platforms of one
            # index digest ("cannot overwrite digest").
            manifest=$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{json .Manifest}}' \
              | jq -r --arg arch "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest')
            [ -n "$manifest" ] || { echo "::error::no linux/$arch manifest in ${IMAGE}@${DIGEST}"; exit 1; }
            docker run -d --name "site-$arch" --platform "linux/$arch" -p 18080:8080 --read-only --cap-drop ALL \
              --security-opt no-new-privileges --tmpfs /tmp:uid=101,gid=101 "${IMAGE}@${manifest}"
            curl -fsS --retry 30 --retry-all-errors --retry-delay 1 -o /dev/null http://127.0.0.1:18080/healthz \
              || { docker logs "site-$arch"; exit 1; }
            headers=$(curl -fsSI http://127.0.0.1:18080/)
            grep -qi '^x-robots-tag: noindex, nofollow' <<<"$headers" || { echo "::error::$arch: no X-Robots-Tag noindex"; exit 1; }
            home=$(curl -fsS http://127.0.0.1:18080/)
            grep -q '<meta name="robots" content="noindex' <<<"$home" || { echo "::error::$arch: no robots meta noindex"; exit 1; }
            if curl -fsS http://127.0.0.1:18080/robots.txt | grep -qi '^sitemap:'; then
              echo "::error::$arch: robots.txt announces the sitemap before the launch"; exit 1
            fi
            docker rm -f "site-$arch" >/dev/null
            echo "$arch ($manifest): healthz, X-Robots-Tag noindex, robots meta noindex, no sitemap: ok"
          done
      - name: Sign the index by digest (key, no public transparency log while private)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false "${IMAGE}@${DIGEST}"
      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          { echo "Index: \`${IMAGE}@${DIGEST}\` (linux/amd64, linux/arm64, signed)"; echo; echo "Tags:"
            printf '%s\n' "$TAGS" | sed '/^$/d; s/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
      # The same build with Lyes's go switched on (indexable, repository links): DEPLOY moves to this tag at the launch.
      # It is not published while a legal text is still a draft to validate (Guimauve Digital): the launched site links
      # to them from every page.
      - name: Legal texts validated?
        id: legal
        run: |
          drafts=$(grep -l '^draft: true' content/legal/*.md* | tr '\n' ' ' || true)
          echo "drafts=$drafts" >> "$GITHUB_OUTPUT"
          if [ -n "$drafts" ]; then
            echo "::warning:::launched not published, legal texts still in draft: $drafts"
            echo "No launched image: legal texts still in draft ($drafts)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build the launched image
        if: steps.legal.outputs.drafts == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          build-args: NEXT_PUBLIC_LAUNCHED=1
          tags: ostrom-site:launched
      # Lighthouse audited this build on localhost URLs; this one has the real ones: it starts, answers, is indexable.
      - name: Smoke test of the launched image
        if: steps.legal.outputs.drafts == ''
        run: |
          docker run -d --name launched -p 8080:8080 ostrom-site:launched
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/healthz
          headers=$(curl -fsSI http://localhost:8080/)
          if grep -qi '^x-robots-tag' <<<"$headers"; then echo "::error::the launched image still asks not to be indexed"; exit 1; fi
          curl -fsS http://localhost:8080/robots.txt | grep -q '^Sitemap: https://ostrom.run/sitemap.xml'
          curl -fsS http://localhost:8080/ | grep -q 'https://github.com/ostrom-hq'
      - name: Push ghcr.io/ostrom-hq/ostrom-site (launched-sha and launched)
        if: steps.legal.outputs.drafts == ''
        run: |
          for tag in "launched-$GITHUB_SHA" launched; do
            docker tag ostrom-site:launched "ghcr.io/ostrom-hq/ostrom-site:$tag"
            docker push "ghcr.io/ostrom-hq/ostrom-site:$tag"
          done
