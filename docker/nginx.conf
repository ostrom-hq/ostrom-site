# ostrom.run: static files exported by Next.js (out/). Unprivileged nginx, port 8080.
server_tokens off;

map $uri $ostrom_cache {
  default                   "public, max-age=0, must-revalidate";
  ~^/_next/static/          "public, max-age=31536000, immutable";
  ~\.(?:woff2|ico|png|svg)$ "public, max-age=86400";
}

server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  charset utf-8;

  gzip on;
  gzip_static on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_vary on;
  gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml application/manifest+json text/x-component;

  add_header Cache-Control $ostrom_cache always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
  add_header X-Frame-Options "DENY" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self' mailto:" always;
  # Written at image build: `X-Robots-Tag: noindex, nofollow` until NEXT_PUBLIC_LAUNCHED=1 (Lyes's go), empty after.
  include /etc/nginx/ostrom-robots.inc;

  # /healthz is the container probe; /health mirrors the API's probe path so a Lighthouse build that points the
  # status page at this container stays free of console errors.
  location ~ ^/health(z)?$ {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/index.html $uri.html =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
