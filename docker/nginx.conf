# ostrom.run: static files exported by Next.js (out/). Unprivileged nginx, port 8080.
server_tokens off;

map $uri $ostrom_cache {
  default                   "public, max-age=0, must-revalidate";
  ~^/_next/static/          "public, max-age=31536000, immutable";
  /site-config.json         "no-store";
  ~\.(?:woff2|ico|png|svg)$ "public, max-age=86400";
}

server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  charset utf-8;

  gzip on;
  gzip_static on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_vary on;
  gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml application/manifest+json text/x-component;

  add_header Cache-Control $ostrom_cache always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
  add_header X-Frame-Options "DENY" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  # Written at start by docker/site-config.sh: frame-ancestors and form-action, which a <meta> cannot carry, and the
  # connect-src that narrows the pages' `https:` to the console, the API and the analytics host.
  include /tmp/ostrom-csp.conf;
  # Written at image build: `X-Robots-Tag: noindex, nofollow` until NEXT_PUBLIC_LAUNCHED=1 (Lyes's go), empty after.
  include /etc/nginx/ostrom-robots.inc;

  # /healthz is the container probe; /health mirrors the API's probe path so a Lighthouse build that points the
  # status page at this container stays free of console errors.
  location ~ ^/health(z)?$ {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Run-time settings of the page (the PostHog key), written at start by docker/site-config.sh from the environment.
  location = /site-config.json {
    default_type application/json;
    alias /tmp/site-config.json;
  }

  # The installers are assets of every ostrom-cli release (`curl -fsSL https://ostrom.run/install.sh | sh`, `irm
  # https://ostrom.run/install.ps1 | iex`): both clients follow the redirect to the latest one. What they install is
  # checked against the release's signed SHA256SUMS, wherever the script came from.
  location = /install.sh {
    return 302 https://github.com/ostrom-hq/ostrom-cli/releases/latest/download/install.sh;
  }
  location = /install.ps1 {
    return 302 https://github.com/ostrom-hq/ostrom-cli/releases/latest/download/install.ps1;
  }

  location / {
    try_files $uri $uri/index.html $uri.html =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
